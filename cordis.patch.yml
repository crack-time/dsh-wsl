# @crack/dsh-wsl activation rows.
#
# This bundle swaps the Windows pwsh shell for a WSL remote bash executor
# ("remote-connection experience"): the model's `bash` tool runs inside a WSL
# distro while the DSH host keeps running natively on Windows.
#
# Merge these rows into the profile cordis.patch.yml (e.g.
# C:\Users\crack\.dsh\profiles\web\cordis.patch.yml). The bare `- id:` entries
# are id-targeted overrides of the rows the shared dsh-base bundle inserted
# (last write wins); the trailing `insert:` mounts the executor as ctx.shell.
# Requires the @crack/dsh-wsl package to be installed (link:) so the row's
# `name` resolves.

# Steal the executor seam: put the Windows pwsh-sandbox executor to sleep so
# the WSL executor below becomes the single ctx.shell provider.
- id: pwsh-sandbox
  disabled: true

# Present the model-facing `bash` tool (Windows defaults to the pwsh tool).
- id: tool-pwsh
  disabled: true
- id: tool-bash
  disabled: false

# Mount the WSL executor as ctx.shell. Set `distro` to your WSL distro
# (wsl -l) or leave it unset to use the default distro.
- insert:
    - id: wsl
      name: '@crack/dsh-wsl'
      config:
        distro: 'Ubuntu-22.04'