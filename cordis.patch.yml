# @crack/dsh-wsl activation row.
#
# Mount the WSL workspace plugin in a profile. The host half registers the
# WSL workspace browser API and the client half seats a "＋ WSL 工作区" button
# in the sidebar. Merge this row into the profile cordis.patch.yml (e.g.
# C:\Users\crack\.dsh\profiles\web\cordis.patch.yml). The @crack/dsh-wsl
# package must be installed (link:) so the row's `name` resolves.
- insert:
    - id: wsl
      name: '@crack/dsh-wsl'